<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop Access Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0c0f;--surface:#111318;--surface2:#181c23;
    --border:#1e2330;--border2:#2a3040;--text:#c8d0e0;--muted:#4a5568;
    --accent:#00d4ff;--green:#00e87a;--red:#ff3b5c;--amber:#ffb020;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:14px}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:1000}
 
  header{border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;background:var(--bg);z-index:100}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-icon{width:28px;height:28px;border:1.5px solid var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center}
  .logo-icon::after{content:'';width:10px;height:10px;border:1.5px solid var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent)}
  .logo-text{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);letter-spacing:.05em;text-transform:uppercase}
  .logo-sub{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono)}
  .status-pill{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .3s}
  .status-dot.connected{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
 
  main{padding:32px;max-width:1400px;margin:0 auto}
  .page-title{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
  .section-heading{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--text);margin-bottom:24px}
 
  /* ---- STAT BAR ---- */
  .stat-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:40px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px 24px;position:relative;overflow:hidden}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);opacity:.4}
  .stat-label{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
  .stat-value{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--text);line-height:1}
  .stat-value.green{color:var(--green)}.stat-value.red{color:var(--red)}
 
  /* ---- MACHINE GRID ---- */
  .machines-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px}
  .machine-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .machine-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface2)}
  .machine-name{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
  .machine-count{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .machine-body{padding:16px 20px;min-height:80px}
 
  .uid-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .uid-row:last-child{border-bottom:none}
 
  .uid-info{flex:1;min-width:0}
  .uid-person{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .uid-hex{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
 
  .toggle-wrap{position:relative;width:36px;height:20px;flex-shrink:0}
  .toggle-wrap input{opacity:0;width:0;height:0;position:absolute}
  .toggle-track{position:absolute;inset:0;background:var(--border2);border-radius:10px;cursor:pointer;transition:background .2s;border:1px solid var(--border2)}
  .toggle-track::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;background:var(--muted);border-radius:50%;transition:transform .2s,background .2s}
  .toggle-wrap input:checked+.toggle-track{background:rgba(0,232,122,.2);border-color:var(--green)}
  .toggle-wrap input:checked+.toggle-track::after{transform:translateX(16px);background:var(--green);box-shadow:0 0 6px var(--green)}
 
  .btn-delete{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:16px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:all .15s;line-height:1;padding-bottom:2px;flex-shrink:0}
  .btn-delete:hover{color:var(--red);border-color:var(--red);background:rgba(255,59,92,.08)}
 
  .add-uid-form{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface2);flex-wrap:wrap}
  .input-uid{flex:1;min-width:80px;background:var(--bg);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:12px;padding:7px 10px;text-transform:uppercase;letter-spacing:.05em;outline:none;transition:border-color .15s}
  .input-uid::placeholder{color:var(--muted);text-transform:none;letter-spacing:0}
  .input-uid:focus{border-color:var(--accent)}
  .input-name{flex:1.5;min-width:100px;background:var(--bg);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-family:var(--sans);font-size:12px;padding:7px 10px;outline:none;transition:border-color .15s}
  .input-name::placeholder{color:var(--muted)}
  .input-name:focus{border-color:var(--accent)}
  .btn-add{background:var(--accent);color:var(--bg);border:none;border-radius:5px;font-family:var(--mono);font-size:11px;font-weight:600;padding:7px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:opacity .15s;white-space:nowrap}
  .btn-add:hover{opacity:.85}
  .empty-state{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;padding:24px 0}
 
  /* ---- TABS ---- */
  .tabs-row{display:flex;border-bottom:1px solid var(--border)}
  .tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--mono);font-size:11px;padding:12px 20px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:all .15s;margin-bottom:-1px}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-btn:hover:not(.active){color:var(--text)}
 
  /* ---- BOTTOM SECTION ---- */
  .bottom-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:40px}
  .section-header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap}
  .filter-btn{background:none;border:1px solid var(--border2);color:var(--muted);font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:4px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:all .15s}
  .filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
 
  .log-table{width:100%;border-collapse:collapse}
  .log-table th{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:10px 24px;border-bottom:1px solid var(--border);font-weight:500}
  .log-table td{padding:11px 24px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
  .log-table tr:last-child td{border-bottom:none}
  .log-table tr:hover td{background:var(--surface2)}
 
  .log-person{font-size:13px;color:var(--text);font-weight:500}
  .log-uid-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
  .log-machine{font-family:var(--mono);font-size:11px;color:var(--accent)}
  .log-time{font-family:var(--mono);font-size:11px;color:var(--muted)}
 
  .badge{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.06em}
  .badge-granted{background:rgba(0,232,122,.12);color:var(--green);border:1px solid rgba(0,232,122,.25)}
  .badge-denied{background:rgba(255,59,92,.12);color:var(--red);border:1px solid rgba(255,59,92,.25)}
  .section-empty{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;padding:40px}
 
  /* ---- CLEAR LOGS ---- */
  .btn-clear-logs{background:none;border:1px solid var(--border2);color:var(--muted);font-family:var(--mono);font-size:10px;padding:4px 12px;border-radius:4px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:all .15s;white-space:nowrap}
  .btn-clear-logs:hover{border-color:var(--red);color:var(--red);background:rgba(255,59,92,.08)}
 
  /* ---- CLEAR LOGS MODAL ---- */
  .clear-modal-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
  .clear-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;transition:border-color .15s}
  .clear-opt:hover{border-color:var(--red)}
  .clear-opt input{accent-color:var(--red);width:14px;height:14px;cursor:pointer}
  .clear-opt-label{font-family:var(--mono);font-size:12px;color:var(--text)}
  .clear-opt-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
 
  /* ---- USAGE CARDS ---- */
  .usage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:20px 24px}
  .usage-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:16px 18px}
  .usage-person{font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px}
  .usage-uid-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em;margin-bottom:12px}
  .usage-stats{display:flex;gap:12px;margin-bottom:10px}
  .usage-stat .num{font-family:var(--mono);font-size:20px;font-weight:600;display:block;line-height:1.2}
  .usage-stat .lbl{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
  .usage-stat.g .num{color:var(--green)}
  .usage-stat.r .num{color:var(--red)}
  .usage-last{font-family:var(--mono);font-size:10px;color:var(--muted)}
 
  /* ---- MODAL ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:28px;width:400px;transform:scale(.95);transition:transform .2s}
  .modal-overlay.open .modal{transform:scale(1)}
  .modal-title{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--red);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
  .modal-body{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:24px}
  .modal-uid{font-family:var(--mono);color:var(--accent)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}
  .btn-cancel{background:none;border:1px solid var(--border2);color:var(--muted);font-family:var(--mono);font-size:11px;padding:8px 16px;border-radius:5px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:all .15s}
  .btn-cancel:hover{border-color:var(--muted);color:var(--text)}
  .btn-confirm-delete{background:rgba(255,59,92,.15);border:1px solid var(--red);color:var(--red);font-family:var(--mono);font-size:11px;padding:8px 16px;border-radius:5px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:all .15s}
  .btn-confirm-delete:hover{background:rgba(255,59,92,.25)}
 
  /* ---- TOAST ---- */
  #toast{position:fixed;bottom:28px;right:28px;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:12px 18px;font-family:var(--mono);font-size:12px;color:var(--text);transform:translateY(80px);opacity:0;transition:all .25s;z-index:9999;max-width:320px}
  #toast.show{transform:translateY(0);opacity:1}
 
  @media(max-width:1100px){.machines-grid{grid-template-columns:1fr 1fr}.stat-bar{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:700px){main{padding:16px}.machines-grid{grid-template-columns:1fr}.stat-bar{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
 
<header>
  <div class="logo">
    <div class="logo-icon"></div>
    <div>
      <div class="logo-text">Access Control</div>
      <div class="logo-sub">Workshop System</div>
    </div>
  </div>
  <div class="status-pill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Connecting...</span>
  </div>
</header>
 
<main>
  <div class="page-title">Dashboard Overview</div>
  <div class="section-heading">Workshop Access Control</div>
 
  <div class="stat-bar">
    <div class="stat-card"><div class="stat-label">Total UIDs</div><div class="stat-value" id="statTotal">—</div></div>
    <div class="stat-card"><div class="stat-label">Authorised</div><div class="stat-value green" id="statGranted">—</div></div>
    <div class="stat-card"><div class="stat-label">Total Scans</div><div class="stat-value" id="statScans">—</div></div>
    <div class="stat-card"><div class="stat-label">Denied</div><div class="stat-value red" id="statDenied">—</div></div>
  </div>
 
  <div class="machines-grid" id="machinesGrid"></div>
 
  <div class="bottom-section">
    <div class="section-header">
      <div class="tabs-row" id="tabsRow">
        <button class="tab-btn active" onclick="switchTab('log',this)">Activity Log</button>
        <button class="tab-btn" onclick="switchTab('usage',this)">Usage by Person</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="filter-row" id="filterRow">
          <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
          <button class="filter-btn" onclick="setFilter('machine_1',this)">Machine 1</button>
          <button class="filter-btn" onclick="setFilter('machine_2',this)">Machine 2</button>
          <button class="filter-btn" onclick="setFilter('machine_3',this)">Machine 3</button>
        </div>
        <button class="btn-clear-logs" onclick="openClearModal()">⌫ Clear Logs</button>
      </div>
    </div>
    <div id="tabContent"></div>
  </div>
</main>
 
<!-- CLEAR LOGS MODAL -->
<div class="modal-overlay" id="clearModal">
  <div class="modal">
    <div class="modal-title">Clear Logs</div>
    <div class="modal-body">Choose which logs to delete. This cannot be undone.</div>
    <div class="clear-modal-opts">
      <label class="clear-opt">
        <input type="radio" name="clearOpt" value="all" checked>
        <div>
          <div class="clear-opt-label">All logs</div>
          <div class="clear-opt-sub">Removes entire /logs path from Firebase</div>
        </div>
      </label>
      <label class="clear-opt">
        <input type="radio" name="clearOpt" value="machine_1">
        <div>
          <div class="clear-opt-label">Machine 1 only</div>
          <div class="clear-opt-sub">Removes logs where machine = machine_1</div>
        </div>
      </label>
      <label class="clear-opt">
        <input type="radio" name="clearOpt" value="machine_2">
        <div>
          <div class="clear-opt-label">Machine 2 only</div>
          <div class="clear-opt-sub">Removes logs where machine = machine_2</div>
        </div>
      </label>
      <label class="clear-opt">
        <input type="radio" name="clearOpt" value="machine_3">
        <div>
          <div class="clear-opt-label">Machine 3 only</div>
          <div class="clear-opt-sub">Removes logs where machine = machine_3</div>
        </div>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeClearModal()">Cancel</button>
      <button class="btn-confirm-delete" onclick="confirmClearLogs()">Clear</button>
    </div>
  </div>
</div>
 
<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-title">Confirm Delete</div>
    <div class="modal-body">
      Remove <span class="modal-uid" id="modalName"></span>
      (<span class="modal-uid" id="modalUID"></span>) from
      <span id="modalMachine"></span>? This will immediately revoke access.
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm-delete" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>
 
<div id="toast"></div>
 
<script type="module">
import { initializeApp }         from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue, query, limitToLast }
                                  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
 
// ================================================================
//  PASTE YOUR FIREBASE CONFIG HERE
// ================================================================
const firebaseConfig = {
  apiKey:            "AIzaSyDbbCMdpKYcBMtgsez_TzclFI0MOpQbSLM",
  authDomain:        "rfid-access-1ae01.firebaseapp.com",
  databaseURL:       "https://rfid-access-1ae01-default-rtdb.firebaseio.com/",
  projectId:         "rfid-access-1ae01",
  storageBucket:     "rfid-access-1ae01.appspot.com",
  messagingSenderId: "1005043182254",
  appId:             "1:1005043182254:web:2e365e857a8b96bdca9b3f"
};
// ================================================================
 
const MACHINES = ["machine_1","machine_2","machine_3"];
const LABELS   = { machine_1:"Machine 1", machine_2:"Machine 2", machine_3:"Machine 3" };
 
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
 
// ---- State ----
const uids  = { machine_1:{}, machine_2:{}, machine_3:{} };
let names      = {};   // { "C761F803": "Sam Jones", ... }  from /names
let logs       = [];
let activeTab  = "log";
let logFilter  = "all";
let pendingDel = null;
 
// ---- Helper: get display name for a UID ----
function nameFor(uid) {
  return names[uid] || null;
}
 
// Returns the name if known, otherwise just the UID
function displayName(uid) {
  return names[uid] || uid;
}
 
// ---- Connection indicator ----
onValue(ref(db, ".info/connected"), snap => {
  const on = snap.val();
  document.getElementById("statusDot").className    = on ? "status-dot connected" : "status-dot";
  document.getElementById("statusText").textContent = on ? "Connected" : "Disconnected";
});
 
// ---- Watch /names — { UID: "Person Name" } ----
onValue(ref(db, "names"), snap => {
  names = {};
  if (snap.exists()) {
    snap.forEach(child => {
      names[child.key] = child.val();
    });
  }
  // Re-render everything now that names have loaded
  renderMachines();
  renderTab();
});
 
// ---- Watch UIDs per machine ----
MACHINES.forEach(machine => {
  onValue(ref(db, machine), snap => {
    uids[machine] = {};
    if (snap.exists()) {
      snap.forEach(child => {
        if (child.key === "logs") return;
        if (typeof child.val() === "boolean") {
          uids[machine][child.key] = child.val();
        }
      });
    }
    renderMachines();
    updateStats();
  });
});
 
// ---- Watch /logs ----
onValue(query(ref(db, "logs"), limitToLast(200)), snap => {
  logs = [];
  if (snap.exists()) {
    snap.forEach(child => {
      const s = child.val();
      if (!s || typeof s !== "object") return;
      logs.push({
        key:       child.key,
        uid:       s.uid       || "UNKNOWN",
        result:    s.result    || "DENIED",
        timestamp: s.timestamp || "",
        machine:   s.machine   || null
      });
    });
  }
  logs.reverse();  // newest first
  renderTab();
  updateStats();
});
 
// ---- Render machine panels ----
function renderMachines() {
  const grid = document.getElementById("machinesGrid");
  grid.innerHTML = "";
  MACHINES.forEach(machine => {
    const entries = Object.entries(uids[machine] || {});
    const count   = entries.length;
 
    const rows = count === 0
      ? `<div class="empty-state">No UIDs registered</div>`
      : entries.map(([uid, granted]) => {
          const person = nameFor(uid);
          return `
            <div class="uid-row">
              <div class="uid-info">
                <div class="uid-person">${person || uid}</div>
                ${person ? `<div class="uid-hex">${uid}</div>` : ""}
              </div>
              <label class="toggle-wrap" title="${granted?"Revoke":"Grant"} access">
                <input type="checkbox" ${granted?"checked":""}
                  onchange="toggleUID('${machine}','${uid}',this.checked)">
                <span class="toggle-track"></span>
              </label>
              <button class="btn-delete" onclick="openModal('${machine}','${uid}')">×</button>
            </div>`;
        }).join("");
 
    const card = document.createElement("div");
    card.className = "machine-card";
    card.innerHTML = `
      <div class="machine-header">
        <div class="machine-name">${LABELS[machine]}</div>
        <div class="machine-count">${count} UID${count!==1?"s":""}</div>
      </div>
      <div class="machine-body">${rows}</div>
      <div class="add-uid-form">
        <input class="input-uid" id="inp-uid-${machine}"
          placeholder="UID e.g. C761F803" maxlength="12"
          onkeydown="if(event.key==='Enter')addUID('${machine}')">
        <input class="input-name" id="inp-name-${machine}"
          placeholder="Person's name"
          onkeydown="if(event.key==='Enter')addUID('${machine}')">
        <button class="btn-add" onclick="addUID('${machine}')">+ Add</button>
      </div>`;
    grid.appendChild(card);
  });
}
 
// ---- Render active tab ----
function renderTab() {
  if (activeTab === "log") renderLog();
  else                     renderUsage();
}
 
// ---- Activity Log ----
function renderLog() {
  const el      = document.getElementById("tabContent");
  let   entries = (logFilter === "all" ? logs : logs.filter(s => s.machine === logFilter)).slice(0, 100);
 
  if (!entries.length) {
    el.innerHTML = `<div class="section-empty">No activity recorded yet</div>`;
    return;
  }
 
  el.innerHTML = `
    <table class="log-table">
      <thead><tr>
        <th>Person</th><th>Machine</th><th>Result</th><th>Time</th>
      </tr></thead>
      <tbody>${entries.map(s => {
        const person  = nameFor(s.uid);
        const badge   = s.result === "GRANTED"
          ? `<span class="badge badge-granted">Granted</span>`
          : `<span class="badge badge-denied">Denied</span>`;
        const machine = s.machine
          ? `<span class="log-machine">${LABELS[s.machine]||s.machine}</span>`
          : `<span style="color:var(--muted);font-family:var(--mono);font-size:11px">—</span>`;
        return `<tr>
          <td>
            <div class="log-person">${person || s.uid}</div>
            ${person ? `<div class="log-uid-sub">${s.uid}</div>` : ""}
          </td>
          <td>${machine}</td>
          <td>${badge}</td>
          <td><span class="log-time">${s.timestamp || "—"}</span></td>
        </tr>`;
      }).join("")}</tbody>
    </table>`;
}
 
// ---- Usage by Person ----
function renderUsage() {
  const el      = document.getElementById("tabContent");
  const stats   = {};
  const entries = logFilter === "all" ? logs : logs.filter(s => s.machine === logFilter);
 
  entries.forEach(s => {
    if (!stats[s.uid]) stats[s.uid] = { granted:0, denied:0, last:"" };
    if (s.result === "GRANTED") stats[s.uid].granted++;
    else                        stats[s.uid].denied++;
    if (!stats[s.uid].last) stats[s.uid].last = s.timestamp;
  });
 
  const keys = Object.keys(stats);
  if (!keys.length) {
    el.innerHTML = `<div class="section-empty">No usage data yet</div>`;
    return;
  }
 
  keys.sort((a,b) =>
    (stats[b].granted + stats[b].denied) - (stats[a].granted + stats[a].denied)
  );
 
  el.innerHTML = `<div class="usage-grid">${keys.map(uid => {
    const s      = stats[uid];
    const total  = s.granted + s.denied;
    const person = nameFor(uid);
    return `<div class="usage-card">
      <div class="usage-person">${person || uid}</div>
      ${person ? `<div class="usage-uid-sub">${uid}</div>` : ""}
      <div class="usage-stats">
        <div class="usage-stat g">
          <span class="num">${s.granted}</span>
          <span class="lbl">Granted</span>
        </div>
        <div class="usage-stat r">
          <span class="num">${s.denied}</span>
          <span class="lbl">Denied</span>
        </div>
        <div class="usage-stat">
          <span class="num" style="color:var(--accent)">${total}</span>
          <span class="lbl">Total</span>
        </div>
      </div>
      <div class="usage-last">Last seen: ${s.last || "—"}</div>
    </div>`;
  }).join("")}</div>`;
}
 
// ---- Stats bar ----
function updateStats() {
  let total=0, granted=0;
  MACHINES.forEach(m => Object.values(uids[m]||{}).forEach(v => { total++; if(v) granted++; }));
  document.getElementById("statTotal").textContent   = total   || "—";
  document.getElementById("statGranted").textContent = granted || "—";
  document.getElementById("statScans").textContent   = logs.length || "—";
  document.getElementById("statDenied").textContent  = logs.filter(s=>s.result!=="GRANTED").length || "—";
}
 
// ---- Toggle UID ----
window.toggleUID = async (machine, uid, value) => {
  try {
    await set(ref(db, `${machine}/${uid}`), value);
    const person = nameFor(uid);
    toast(`${person||uid} → ${value?"access granted":"access revoked"}`);
  } catch(e) { toast("Error: "+e.message, true); }
};
 
// ---- Add UID — also writes name to /names if provided ----
window.addUID = async (machine) => {
  const uidInp  = document.getElementById(`inp-uid-${machine}`);
  const nameInp = document.getElementById(`inp-name-${machine}`);
  const uid     = uidInp.value.trim().toUpperCase();
  const name    = nameInp.value.trim();
 
  if (uid.length < 4)                     { toast("Enter a valid UID (min 4 chars)", true); return; }
  if (uids[machine]?.[uid] !== undefined) { toast("UID already exists on this machine", true); return; }
 
  try {
    // Write access boolean
    await set(ref(db, `${machine}/${uid}`), true);
    // Write name mapping if provided
    if (name) {
      await set(ref(db, `names/${uid}`), name);
    }
    uidInp.value  = "";
    nameInp.value = "";
    toast(`Added ${name||uid} to ${LABELS[machine]}`);
  } catch(e) { toast("Error: "+e.message, true); }
};
 
// ---- Delete modal ----
window.openModal = (machine, uid) => {
  pendingDel = {machine, uid};
  const person = nameFor(uid);
  document.getElementById("modalName").textContent    = person || "";
  document.getElementById("modalUID").textContent     = uid;
  document.getElementById("modalMachine").textContent = LABELS[machine];
  // Hide name span if no name
  document.getElementById("modalName").style.display = person ? "" : "none";
  document.getElementById("deleteModal").classList.add("open");
};
window.closeModal = () => {
  pendingDel = null;
  document.getElementById("deleteModal").classList.remove("open");
};
window.confirmDelete = async () => {
  if (!pendingDel) return;
  const {machine, uid} = pendingDel;
  try {
    await remove(ref(db, `${machine}/${uid}`));
    // Note: we intentionally keep the /names entry so logs still show names
    toast(`Deleted ${nameFor(uid)||uid} from ${LABELS[machine]}`);
  } catch(e) { toast("Error: "+e.message, true); }
  closeModal();
};
document.getElementById("deleteModal").addEventListener("click", e => {
  if (e.target.id === "deleteModal") closeModal();
});
 
// ---- Clear logs modal ----
window.openClearModal = () => {
  // Reset to "all" selection
  document.querySelector('input[name="clearOpt"][value="all"]').checked = true;
  document.getElementById("clearModal").classList.add("open");
};
window.closeClearModal = () => {
  document.getElementById("clearModal").classList.remove("open");
};
window.confirmClearLogs = async () => {
  const selected = document.querySelector('input[name="clearOpt"]:checked').value;
  try {
    if (selected === "all") {
      // Delete the entire /logs node
      await remove(ref(db, "logs"));
      toast("All logs cleared");
    } else {
      // Delete only entries matching that machine — loop through and remove individually
      const toDelete = logs.filter(s => s.machine === selected);
      if (toDelete.length === 0) {
        toast("No logs found for " + LABELS[selected], true);
        closeClearModal();
        return;
      }
      const promises = toDelete.map(s => remove(ref(db, `logs/${s.key}`)));
      await Promise.all(promises);
      toast(`Cleared ${toDelete.length} log${toDelete.length !== 1 ? "s" : ""} for ${LABELS[selected]}`);
    }
  } catch(e) { toast("Error: " + e.message, true); }
  closeClearModal();
};
document.getElementById("clearModal").addEventListener("click", e => {
  if (e.target.id === "clearModal") closeClearModal();
});
 
// ---- Tab + filter ----
window.switchTab = (tab, btn) => {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderTab();
};
window.setFilter = (filter, btn) => {
  logFilter = filter;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderTab();
};
 
// ---- Toast ----
let tt;
window.toast = (msg, isError=false) => {
  const el = document.getElementById("toast");
  el.textContent       = msg;
  el.style.borderColor = isError ? "var(--red)" : "var(--border2)";
  el.style.color       = isError ? "var(--red)" : "var(--text)";
  el.classList.add("show");
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove("show"), 3000);
};
 
// Initial render
renderMachines();
renderTab();
updateStats();
</script>
</body>
</html>
